<header>
  <div class="logo">
    <span class="logo-icon">
      <svg
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 3L20 7.5V16.5L12 21L4 16.5V7.5L12 3Z" />
        <path d="M12 3L12 21" />
        <path d="M4 7.5L12 12L20 7.5" />
      </svg>
    </span>
    <span class="logo-text">Micro Frontend Shell</span>
    <span class="ng-version-badge">
      <span class="ng-shield">&#9400;</span>
      <span class="ng-version-text">
        <span class="ng-version-label">Angular</span>
        <span class="ng-version-number">{{ angularVersion }}</span>
      </span>
    </span>
  </div>
  <nav>
    @for (mfe of mfeList; track $index) {
    <a
      [routerLink]="mfe.path"
      routerLinkActive="active"
      [style.--mfe-color]="mfe.color"
    >
      <span class="nav-label">{{ mfe.label }}</span>
      <span class="nav-version">{{ mfe.angularVersion }}</span>
    </a>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>
